[package]
name = "hdrcast-p2p"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
hdrcast-core = { path = "../core" }
socket2 = "0.6.5"
thiserror = "2.0.21"
# The signaling API. Plain http is the normal case; https goes through the operating system's TLS (Schannel /
# Secure Transport; OpenSSL on Linux) and its certificate store, as it did with .NET. rustls would bring a C and
# assembly build (ring / aws-lc) that cannot be cross-checked for macOS from a Windows PC.
# (Routers are not talked to through it: see src/router_http.rs.)
ureq = { version = "3.4.2", default-features = false, features = ["native-tls"] }

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_System_IO"] }

[target."cfg(unix)".dependencies]
libc = "0.2.190"

[dev-dependencies]
serde_json = { version = "1.0.154", features = ["preserve_order"] }
# the guard, for the test of the whole viewer path under loss (tests/lossy_path_tests.rs)
hdrcast-media = { path = "../media" }
