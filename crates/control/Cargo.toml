[package]
name = "hdrcast-control"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

# The small program that types for HdrCast into windows of programs run as administrator (src/elevated/mod.rs).
[[bin]]
name = "HdrCastInput"
path = "src/bin/hdrcast_input.rs"

[dependencies]
chacha20poly1305 = "0.11.0"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi",
    "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO",
    "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_Com", "Win32_System_SystemInformation",
    "Win32_System_Registry", "Win32_System_Services", "Win32_System_RemoteDesktop", "Win32_UI_HiDpi", "Win32_UI_Shell",
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
core-graphics = { version = "0.25.0", features = ["highsierra"] }
