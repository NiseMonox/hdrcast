[package]
name = "hdrcast"
description = "HDR screen sharing between friends, peer to peer"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
build = "build.rs"

[[bin]]
name = "HdrCast"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hdrcast-core = { path = "../crates/core" }
hdrcast-capture = { path = "../crates/capture" }
hdrcast-media = { path = "../crates/media" }
hdrcast-control = { path = "../crates/control" }
hdrcast-p2p = { path = "../crates/p2p" }
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
arboard = { version = "3", default-features = false }
rfd = { version = "0.15", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-version = "0.1"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading", "Win32_System_DataExchange", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }

# flock for the one-app-per-profile lock (src/instance.rs)
[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

# The panel over the player (src/overlay.rs): mpv's window, the mouse, and handing the keyboard back to mpv
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.5", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "libc",
    "NSResponder",
    "NSRunningApplication",
    "NSWindow",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "CFArray",
    "CFBase",
    "CFCGTypes",
    "CFDictionary",
    "CFNumber",
    "CFString",
] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
    "std",
    "CGEvent",
    "CGEventSource",
    "CGEventTypes",
    "CGGeometry",
    "CGWindow",
] }

[features]
# custom-protocol = a production build: the UI in ../ui is embedded in the executable.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
devtools = ["tauri/devtools"]
